name: Backend Image

on:
  push:
    branches:
      - master
    paths:
      - backend/**
      - scripts/deploy-lingodoc-backend
      - .github/workflows/backend-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/pupil-ai/lingodoc-backend
  RELEASE_IMAGE_FILE: /var/www/lingodoc/releases/backend-image.txt

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:master-${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Write release manifest to server
        env:
          SSH_HOST: ${{ secrets.LINGODOC_API_HOST }}
          SSH_USER: ${{ secrets.LINGODOC_API_USER }}
          SSH_KEY: ${{ secrets.LINGODOC_API_SSH_KEY }}
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ] || [ -z "$SSH_KEY" ]; then
            echo "Skipping server manifest update because LINGODOC_API_HOST, LINGODOC_API_USER, or LINGODOC_API_SSH_KEY is not configured."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/lingodoc_api_key
          chmod 600 ~/.ssh/lingodoc_api_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/lingodoc_api_key "$SSH_USER@$SSH_HOST" \
            "set -euo pipefail; install -d -m 755 /var/www/lingodoc/releases; printf '%s\n' '$IMAGE_REF' > '${RELEASE_IMAGE_FILE}.next'; mv '${RELEASE_IMAGE_FILE}.next' '$RELEASE_IMAGE_FILE'"
          echo "Wrote $IMAGE_REF to $RELEASE_IMAGE_FILE"

      - name: Print deploy command
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          echo "Backend image: $IMAGE_REF"
          echo "Deploy on server with: deploy-lingodoc-backend"
